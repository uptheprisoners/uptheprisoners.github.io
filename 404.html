<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — The Prisoners</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17181c">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17181c;--rust:#b8502f;--bone:#ece7dc;--dim:#b9b3a5;--line:#34363c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 14px),var(--ink);color:var(--bone);font-family:'IBM Plex Sans',sans-serif}
.wrap{width:min(760px,calc(100% - 32px));text-align:center}
.logo{width:min(440px,82vw);height:auto;margin:0 auto 34px;display:block}
.code{font-family:'Oswald',sans-serif;font-size:clamp(80px,18vw,160px);line-height:.8;color:var(--rust);font-weight:700}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:32px;margin:24px 0 10px}
p{color:var(--dim);margin:0 auto;max-width:52ch;line-height:1.6}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:28px}
a{display:inline-flex;padding:11px 17px;border:1px solid var(--line);color:var(--bone);text-decoration:none;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
a:hover{border-color:var(--rust);color:var(--rust)}
.credit{margin-top:48px;color:#717985;font-size:11px}
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="the-prisoners-logo.png" alt="The Prisoners">
    <div class="code">404</div>
    <h1>Lost in Time?</h1>
    <p>Η σελίδα που ζητήσατε δεν βρέθηκε. / The page you were looking for could not be found.</p>
    <div class="actions">
      <a href="index.html">Ελληνικά</a>
      <a href="en.html">English</a>
    </div>
    <div class="credit">Website design &amp; development by Debbie Moraiti</div>
  </main>
</body>
</html>
