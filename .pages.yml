media:
  input: cms-test-media
  output: /cms-test-media

content:
  - name: cms-test
    label: CMS Test
    type: file
    path: cms-test/content.json
    fields:
      - name: title
        label: Title
        type: string
      - name: message
        label: Message
        type: text

  - name: events-test
    label: Events Test
    type: collection
    path: cms-test/events
    format: json
    filename: "{date}-{title}.json"
    view:
      fields: [title, date, venue]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: venue
        label: Venue
        type: string
      - name: description
        label: Description
        type: text
      - name: link
        label: Event link
        type: string
