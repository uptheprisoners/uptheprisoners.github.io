media:
  - name: site-images
    label: Site images
    input: .
    output: /
    categories: [image]
    rename: false
  - name: cms-test-images
    label: CMS Test uploads
    input: cms-test-media
    output: /cms-test-media
    categories: [image]
    rename: safe

content:
  - name: cms-test
    label: CMS Test
    type: file
    path: cms-test/content.json
    fields:
      - name: title
        label: Title
        type: string
      - name: message
        label: Message
        type: text

  - name: events-test
    label: Events Test
    type: collection
    path: cms-test/events
    format: json
    filename: "{date}-{title}.json"
    view:
      fields: [title, date, venue]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event title
        type: string
        required: true
        description: Internal event title used in the CMS and filename.
      - name: poster
        label: Poster
        type: image
        required: true
        options:
          media: site-images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: false
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: venue
        label: Venue / Address
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
        options:
          format: html
          media: false
      - name: special_guests
        label: Special Guests
        type: string
      - name: doors
        label: Doors
        type: string
        description: "Example: 20:00"
      - name: presale_price
        label: Presale price (€)
        type: number
      - name: door_price
        label: Door price (€)
        type: number
      - name: ticket_url
        label: Tickets link
        type: string
      - name: official_event_url
        label: Official Event link
        type: string
      - name: setlist_url
        label: Setlist.fm link
        type: string
